<div id="event-list-header" class="event-list-header hidden">
    <a href="./submit/" class="btn-outline">
        <span class="material-symbols-outlined" aria-hidden="true">add</span>
        Publier un évènement
    </a>
</div>

<section id="event-filter" class="filter-accordion hidden">
    
    <button id="filter-toggle" class="accordion-toggle" aria-expanded="false" aria-controls="filter-panel" >
        <span class="material-symbols-outlined">filter_list</span>
        Filtrer
        <span class="material-symbols-outlined chevron">expand_more</span>
    </button>

    
    <div id="filter-panel" class="accordion-panel" hidden>
        <form id="filter-form">
            <label class="pico">
                <fieldset id="filter-category">
                <legend>Catégories</legend></fieldset>
            </label>

            <label class="pico">
                <fieldset id="filter-parental-guide">
                <legend>Guide Parental</legend></fieldset>
            </label>

            <label for="tag-input" class="pico">Tags</label>
            <div class="tag-input-container" id="tag-container">
                <input type="text" id="tag-input" placeholder="Suggestions: enfants, rock, cirque..." autocomplete="off">
            </div>

            <div class="date-range pico">
                <label>
                    Du
                    <input type="date" name="from">
                </label>

                <label>
                    au
                    <input type="date" name="to">
                </label>
            </div>

            <div id="filter-error" class="notice notice-error hidden">
                <span class="notice-icon">❌</span>
                <div class="notice-content">
                    <strong id="title">Erreur</strong>
                    <p id="text"></p>
                </div>
            </div>

            <!-- Actions -->
            <div class="filter-actions pico">
                <button type="submit">Appliquer le filtre</button>
                <button type="button" id="reset-filters" class="secondary">Enlever le filtre</button>
            </div>
        </form>
    </div>
</section>

<div id="event-modal" class="modal-overlay hidden">
    <div class="modal-card" role="dialog" aria-modal="true">
        <button class="modal-close" aria-label="Close">
            <span class="material-symbols-outlined">close</span>
        </button>
        <div id="modal-content" class="modal-content"></div>
        
        <div id="modal-actions" class="modal-actions hidden">
            <!-- <button id="modal-edit-event" class="modal-edit-event">
                Editer cet évènement
                <span class="material-symbols-outlined" aria-hidden="true">edit</span>
            </button> -->
            <button id="modal-delete-event" class="modal-edit-event delete">
                Supprimer cet évènement
                <span class="material-symbols-outlined" aria-hidden="true">delete</span>
            </button>
        </div>
    </div>
</div>

<article id="events"></article>

<script type="module" defer src="assets/js/events.js"></script>
