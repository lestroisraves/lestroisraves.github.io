
<div id="account-page">
    <div id="notice-tip" class="notice notice-tip hidden">
        <span class="notice-icon">💡</span>
        <div class="notice-content">
            <p id="text"></p>
        </div>
    </div>

    <div id="notice-error" class="notice notice-error hidden">
        <span class="notice-icon">❌</span>
        <div class="notice-content">
            <p id="text"></p>
        </div>
    </div>

    <!-- RESET PWD -->
    <div id="rstpwd-container" class="account-section hidden">
        <article class="formtile-tile pico">
            <form id="rstpwd-form">
                <label>
                    Email
                    <input
                        type="email"
                        id="email"
                        placeholder="email@exemple.fr"
                        required
                    >
                </label>

                <div>
                    <button type="submit" id="button">Reinitialiser le mot de passe</button>
                </div>
            </form>
        </article>
    </div>

    <!-- SIGN IN -->
    <div id="signin-container" class="account-section">
        <article class="formtile-tile pico">
            <form id="signin-form">
                <label>
                    Email
                    <input
                        type="email"
                        id="email"
                        placeholder="email@exemple.fr"
                        required
                    >
                </label>

                <label>
                    Mot de passe
                    <input
                        type="password"
                        id="password"
                        placeholder=""
                        required
                    >
                </label>

                <div>
                    <button type="submit" id="button">Se connecter</button>
                </div>
            </form>

            <p>
                Pas de compte ?
                <a href="#" id="show-signup">Créer un compte</a>
            </p>
            <p>
                Mot de passe oublié ?
                <a href="#" id="reset-password">Réinitialiser</a>
            </p>
        </article>
    </div>

    <!-- SIGN UP -->
    <div id="signup-container" class="account-section hidden">
        <article class="formtile-tile pico">
            <form id="signup-form">
                <label>
                    Email
                    <input
                        type="email"
                        id="email"
                        placeholder="email@exemple.fr"
                        required
                    >
                </label>

                <label>
                    Nom / pseudo
                    <input
                        type="text"
                        id="display_name"
                        placeholder="Votre nom public"
                        required
                    >
                </label>

                <label>
                    Mot de passe
                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 8 caractères"
                        minlength="8"
                        required
                    >
                </label>

                <div>
                    <button type="submit" id="button">Créer un compte</button>
                </div>
            </form>

            <p>
                Déjà un compte ?
                <a href="#" id="show-signin">Se connecter</a>
            </p>
        </article>
    </div>

    <!-- ACCOUNT -->
    <div id="account-container" class="account-section hidden">
        <article class="formtile-tile pico">
            <form id="account-form">
                <label>
                    Connecté en tant que:
                    <input
                        type="text"
                        id="account-name"
                        aria-label="Read-only input"
                        readonly
                    >
                </label>

                <label>
                    Email
                    <input
                        type="email"
                        id="account-email"
                        ria-label="Read-only input"
                        readonly
                    >
                </label>

                <label>
                    Role
                    <input
                        type="text"
                        id="account-role"
                        ria-label="Read-only input"
                        readonly
                    >
                </label>

                <div>
                    <button type="submit">Se déconnecter</button>
                </div>
            </form>
        </article>
    </div>
</div>

<script type="module" defer src="../assets/js/account.js"></script>
