<div id="success-modal" class="modal-overlay success hidden">
    <div class="modal-card success" role="dialog" aria-modal="true">
        <button id="modal-close" class="modal-close" aria-label="Fermer">
            <span class="material-symbols-outlined">close</span>
        </button>
        <div id="modal-content" class="modal-content">
            <span class="notice-icon">✔️</span>
            <span id="text"></span>
        </div>
    </div>
</div>

<div id="error-modal" class="modal-overlay error hidden">
    <div class="modal-card error" role="dialog" aria-modal="true">
        <button id="modal-close" class="modal-close" aria-label="Fermer">
            <span class="material-symbols-outlined">close</span>
        </button>
        
        <div id="modal-content" class="modal-content">
            <span class="notice-icon">❌</span>
            <span id="text"></span>
        </div>
    </div>
</div>
