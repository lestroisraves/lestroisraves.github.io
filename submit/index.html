<div id="submit-container" class="submit-section" hidden>
    <div id="account-detail" class="account-tile detail-section" hidden>
        <div class="detail-row">
            <span class="label">Contributeur</span>
            <span id="account-role" class="value detail-user"></span>

    <article class="submit-tile" data-allow-action>
        <form id="event-form">
            <label class="pico">
                Titre de l'évènement *
                <input type="text" id="title" placeholder="60 charactères maximum" maxlength="60" required>
            </label>

            <label class="pico">
                Nom du lieu *
                <input type="text" id="location_name" placeholder="" required>
            </label class="pico">

            <label class="pico">
                Zone géographique *
                <select name="select" id="area" required>
                    <option value="" disabled selected hidden>Choisissez...</option>
                </select>
            </label>

            <label class="pico">
                Adresse du lieu
                <input type="text" id="location_address" placeholder="">
            </label>

            <label class="pico">
                Description de l'évènement
                <textarea id="long_description" class="formtile-longtext" placeholder=""></textarea>
            </label>

            <label class="pico">
                Catégorie *
                <select name="select" id="category" required>
                    <option value="" disabled selected hidden>Choisissez...</option>
                </select>
            </label>

            <label class="pico">
                Guide parental *
                <select name="select" id="pg" required></select>
            </label>

            <label class="pico">
                Date *
                <input type="date" id="event_date" required>
            </label>

            <label id="end_date_container" class="pico" hidden>
                Date de fin (si plusieurs jours)
                <input type="date" id="end_date">
            </label>

            <label class="pico">
                Heure de début
                <input type="time" id="event_start_time">
            </label>

            <label for="tag-input" class="pico">Tags (mots-clefs pour décrire l'évènement, 4 maximum)</label>
            <div class="tag-input-container" id="tag-container">
                <input type="text" id="tag-input" data-action="tag-input" placeholder="Suggestions: enfants, rock, cirque..." autocomplete="off">
            </div>

            <label class="pico">
                Téléphone
                <input type="tel" inputmode="tel" id="phone" placeholder="+33 6 12 34 56 78" data-input-type="phone" data-action="phone-input">
            </label>

            <label class="pico">
                Email
                <input type="email" id="email" placeholder="votre@email.com">
            </label>

            <label class="pico">
                Site internet
                <input type="text" id="site_url" placeholder="https://votresite.com">
            </label>

            <label class="pico">
                <fieldset>
                    <label>
                        <input name="to_eat" type="checkbox" role="switch" />
                        À manger sur place
                    </label>
                </fieldset>
            </label>

            <label class="pico">
                Prix / participation *
                <select name="select" id="price-choice" data-change-type="price-choice" required></select>
            </label>

            <label class="pico">
                Prix
                <input type="number" id="max_price" placeholder="0.00" step=0.01 min=0 disabled>
            </label>

            <label class="pico">
                Prix réduit
                <input type="number" id="min_price" placeholder="0.00" step=0.01 min=0 disabled>
            </label>

            <label class="pico">
                Image (maximum 5 Mo)
                <div class="event-image-wrapper preview" hidden>
                    <img id="event-thumbnail" class="event-thumbnail loaded" alt="image évènement">
                </div>
                <div class="image-choice">
                    <input type="file" id="event-image" data-change-type="image-choice" accept="image/*" hidden/>
                    <button type="button" id="pick-file-btn" class="secondary" data-action="pick-file">Choisir</button>
                    <span id="file-name" class="file-name">aucun fichier choisi</span>
                    <span id="remove-image-btn" class="material-symbols-outlined delete-image-btn" data-action="remove-image" aria-hidden="true" hidden>delete</span>
                </div>

            </label>

            <label id="cancel-btn" class="pico" hidden>
                <button type="submit" class="secondary" data-action="cancel-edit">Annuler</button>
            </label>

            <label class="pico">
                <button type="submit" id="button" data-action="submit-event">Publier</button>
            </label>
        </form>

    </article>
</div>
