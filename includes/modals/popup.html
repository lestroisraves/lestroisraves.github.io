<div id="success-modal" class="modal-overlay success hidden" data-action="close-modal">
    <div class="modal-card success" data-no-action role="dialog" aria-modal="true">
        <button id="modal-close" class="modal-close" data-allow-action data-action="close-modal" aria-label="Fermer">
            <span class="material-symbols-outlined">close</span>
        </button>
        <div id="modal-content" class="modal-content">
            <span class="notice-icon">✔️</span>
            <span id="text"></span>
        </div>
    </div>
</div>

<div id="error-modal" class="modal-overlay error hidden" data-action="close-modal">
    <div class="modal-card error" role="dialog" aria-modal="true">
        <button id="modal-close" class="modal-close" data-allow-action data-action="close-modal" aria-label="Fermer">
            <span class="material-symbols-outlined">close</span>
        </button>
        
        <div id="modal-content" class="modal-content">
            <span class="notice-icon">❌</span>
            <span id="text"></span>
        </div>
    </div>
</div>

<div id="age-help-modal" class="modal-overlay info hidden" data-action="close-modal">
    <div class="modal-card info" data-no-action role="dialog" aria-modal="true">
        <button class="modal-close" data-allow-action data-action="close-modal" aria-label="Fermer">
            <span class="material-symbols-outlined">close</span>
        </button>
        <div class="modal-content help">
            <h3 class="help-title"><span class="notice-icon">ℹ️</span> Âge du public</h3>
            <p>Indiquez la tranche d'âge à laquelle s'adresse l'évènement (de 0 à 18 ans).</p>
            <ul>
                <li><strong>Âge minimum</strong> : âge à partir duquel l'évènement est adapté.</li>
                <li><strong>Âge maximum</strong> : âge jusqu'auquel l'évènement reste adapté.</li>
            </ul>
            <p>Laissez les deux champs vides pour un évènement tout public.</p>
        </div>
    </div>
</div>
