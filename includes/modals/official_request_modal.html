<div id="official-request-modal" class="modal-overlay hidden" data-action="close-modal">
    <div class="modal-card long" data-no-action role="dialog" aria-modal="true">
        <button id="modal-close" class="modal-close" data-allow-action data-action="close-modal" aria-label="Fermer">
            <span class="material-symbols-outlined">close</span>
        </button>
        
        <div id="modal-content" class="modal-content">
            <p>
                Vous souhaitez devenir contributeur <strong>officiel</strong> et publier instantanément.
                Veuillez décrire votre demande (minimum 100 charactères) :
            </p>
            
            <div class="textarea-wrapper">
                <textarea
                    class="details-textarea"
                    id="details-input"
                    placeholder="Description de votre demande (minimum 100 charactères)"
                    minlength="100"
                    row="8"
                    data-input-type="request-details"
                ></textarea>
                <div class="char-counter">
                    <span id="request-char-count">0</span>/100
                </div>
            </div>

        </div>
        
        <div id="modal-actions" class="modal-actions">
            <button id="modal-official-request-btn" class="modal-btn info" disabled data-allow-action data-action="send-official-request">
                Envoyer
                <span class="material-symbols-outlined" aria-hidden="true">send</span>
            </button>
        </div>
    </div>
</div>
