<div id="event-modal" class="modal-overlay hidden" data-action="close-modal">
    <div id="event-card" class="modal-card event" data-no-action role="dialog" aria-modal="true">
        <button id="modal-close" class="modal-close" data-allow-action data-action="close-modal" aria-label="Fermer">
            <span class="material-symbols-outlined">close</span>
        </button>
        
        <div id="event-modal-content" class="modal-content"></div>
        
        <div id="modal-actions-myevents" class="modal-actions event hidden">
            <button id="modal-delete-event-btn" class="modal-btn delete" data-allow-action data-action="open-confirm-modal" data-action-type="delete", data-type="event">
                Supprimer cet évènement
                <span class="material-symbols-outlined" aria-hidden="true">delete</span>
            </button>
        </div>

        <div id="modal-actions-pendingevents" class="modal-actions event hidden">
            <button id="modal-accept-event-btn" class="modal-btn info" data-allow-action data-action="open-confirm-modal" data-action-type="accept", data-type="event">
                Accepter
                <span class="material-symbols-outlined" aria-hidden="true">check</span>
            </button>
            <button id="modal-reject-event-btn" class="modal-btn delete" data-allow-action data-action="open-confirm-modal" data-action-type="reject", data-type="event">
                Rejeter
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
            </button>
        </div>
    </div>
</div>
