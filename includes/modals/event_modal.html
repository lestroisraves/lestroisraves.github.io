<div id="event-modal" class="modal-overlay hidden">
    <div id="event-card" class="modal-card event" role="dialog" aria-modal="true">
        <button id="modal-close" class="modal-close" aria-label="Fermer">
            <span class="material-symbols-outlined">close</span>
        </button>
        
        <div id="event-modal-content" class="modal-content"></div>
        
        <div id="modal-actions-myevents" class="modal-actions event hidden">
            <button id="modal-delete-event-btn" class="modal-btn delete">
                Supprimer cet évènement
                <span class="material-symbols-outlined" aria-hidden="true">delete</span>
            </button>
        </div>

        <div id="modal-actions-pendingevents" class="modal-actions event hidden">
            <button id="modal-accept-event-btn" class="modal-btn info">
                Accepter
                <span class="material-symbols-outlined" aria-hidden="true">check</span>
            </button>
            <button id="modal-reject-event-btn" class="modal-btn delete">
                Rejeter
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
            </button>
        </div>
    </div>
</div>
