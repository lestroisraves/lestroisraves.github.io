<div id="confirm-modal" class="modal-overlay delete hidden">
    <div class="modal-card modal-small" role="dialog" aria-modal="true">
        <button id="modal-close" class="modal-close" aria-label="Fermer">
            <span class="material-symbols-outlined">close</span>
        </button>

        <div class="modal-content">
            <p id="confirm-title"></p>
            <div class="confirm-code" id="confirm-code"></div>
            <input
                type="text"
                id="confirm-input"
                placeholder="Tapez le code"
                inputmode="numeric"
                maxlength="4"
                autocomplete="off"
            >
        </div>

        <div class="modal-actions">
            <button id="confirm-btn" class="modal-btn delete" disabled>
                <span id="confirm-btn-icon" class="material-symbols-outlined" aria-hidden="true">delete</span>
            </button>
        </div>
    </div>
</div>
