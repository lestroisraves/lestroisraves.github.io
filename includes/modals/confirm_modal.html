<div id="confirm-modal" class="modal-overlay delete hidden" data-action="close-modal">
    <div class="modal-card long modal-small" data-no-action role="dialog" aria-modal="true">
        <button id="modal-close" class="modal-close" data-allow-action data-action="close-modal" aria-label="Fermer">
            <span class="material-symbols-outlined">close</span>
        </button>

        <div class="modal-content">
            <!-- <p id="confirm-title" class="confirm-title hidden"></p> -->

            <div id="confirm-reasons" class="confirm-reasons hidden">
                <p class="confirm-reasons-title">Motif(s) de votre décision :</p>
                <div id="confirm-reasons-list" class="confirm-reasons-list"></div>
                <textarea
                    id="confirm-reason-text"
                    class="details-textarea confirm-reason-text"
                    placeholder="Ajouter une explication (facultatif)"
                ></textarea>
            </div>

            <div class="confirm-code-row">
                <div class="confirm-code" id="confirm-code"></div>
                <input
                    type="text"
                    id="confirm-input"
                    placeholder="Tapez le code ici"
                    inputmode="numeric"
                    maxlength="4"
                    autocomplete="off"
                    data-input-type="confirm-code"
                >
            </div>
        </div>

        <div class="modal-actions">
            <button id="confirm-btn" class="modal-btn confirm delete" disabled data-allow-action data-action="confirm" data-action-type="">
                <span id="confirm-btn-icon" class="material-symbols-outlined" aria-hidden="true">delete</span>
            </button>
        </div>
    </div>
</div>
