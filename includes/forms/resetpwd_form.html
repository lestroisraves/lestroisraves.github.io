<div id="rstpwd-container" class="account-section hidden">
    <article class="formtile-tile pico">
        <form id="rstpwd-form">
            <label>
                Email
                <input
                    type="email"
                    id="email"
                    placeholder="email@exemple.fr"
                    required
                >
            </label>

            <div>
                <button type="submit" id="button" data-action="send-reset-password-request">Reinitialiser le mot de passe</button>
            </div>
        </form>

        <p>
            La mémoire vous est revenue ?
            <a href="#" id="show-signin-from-rst" data-action="show-signin">Se connecter</a>
        </p>
    </article>
</div>
